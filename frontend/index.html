<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My First App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>My Tasks</h1>
      <p id="summary" class="summary"></p>

      <form id="add-form">
        <input id="title" type="text" placeholder="What tasks doing?" autocomplete="off" required />
        <button type="submit">Add</button>
      </form>

      <p id="error" class="error" hidden></p>
      <ul id="tasks"></ul>
      <button id="clear-done" class="clear-done" type="button" hidden>Clear finished</button>
    </main>

    <script src="app.js"></script>
  </body>
</html>
